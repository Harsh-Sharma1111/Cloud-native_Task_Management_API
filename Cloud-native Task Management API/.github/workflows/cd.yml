name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Build, Push, and Deploy
    # Only run this if the CI workflow was actually successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Use the exact commit SHA that triggered the CI workflow
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to EC2 and Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd deploy
            
            echo "Pulling latest images..."
            docker compose pull
            
            echo "Restarting containers..."
            docker compose up -d

            # Health check loop
            TIMEOUT=30
            START=$(date +%s)
            
            # NOTE: Backend runs on port 5000
            HEALTH_URL="http://localhost:5000/health"
            
            echo "Waiting for health check at $HEALTH_URL..."
            
            while true; do
              if curl -sSf "$HEALTH_URL" > /dev/null; then
                echo "Deploy successful! Health check passed."
                exit 0
              fi
              
              NOW=$(date +%s)
              ELAPSED=$((NOW - START))
              
              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "Deployment failed: Health check timed out after 30 seconds."
                exit 1
              fi
              
              sleep 2
            done
