name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Cloud-native Task Management API/backend/requirements.txt"
          pip install pytest pytest-cov

      - name: Run tests with coverage
        working-directory: "./Cloud-native Task Management API/backend"
        run: python -m pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: "Cloud-native Task Management API/backend/coverage.xml"
          if-no-files-found: warn

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: "Cloud-native Task Management API/frontend/package-lock.json"

      - name: Install dependencies
        working-directory: "./Cloud-native Task Management API/frontend"
        run: npm ci

      - name: Run tests
        working-directory: "./Cloud-native Task Management API/frontend"
        run: npm run test
